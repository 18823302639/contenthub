# 由 Nginx 官方镜像在 http 区块内加载。
server {
    listen 80;
    server_name _;
    root /srv/contenthub;
    charset utf-8;

    location = / {
        rewrite ^ /index.html last;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Vite 的 JS、动态分块和 CSS 文件名带内容哈希。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HashRouter 的片段留在浏览器内，缺失文件直接返回 404。
    location / {
        try_files $uri =404;
    }
}
