services:
  contenthub:
    build:
      context: .
      args:
        VITE_USE_MOCK: "${VITE_USE_MOCK:-true}"
        VITE_NOCODB_API_URL: "${VITE_NOCODB_API_URL:-}"
        VITE_NOCODB_TOKEN: "${VITE_NOCODB_TOKEN:-}"
        VITE_N8N_WEBHOOK_BASE_URL: "${VITE_N8N_WEBHOOK_BASE_URL:-}"
        VITE_WEBHOOK_SECRET: "${VITE_WEBHOOK_SECRET:-}"
        VITE_WF2_GENERATE_WEBHOOK_URL: "${VITE_WF2_GENERATE_WEBHOOK_URL:-}"
        VITE_WF3_RENDER_WEBHOOK_URL: "${VITE_WF3_RENDER_WEBHOOK_URL:-}"
        VITE_NOCODB_RSS_SOURCES_TABLE_ID: "${VITE_NOCODB_RSS_SOURCES_TABLE_ID:-}"
        VITE_NOCODB_RSS_SYNC_SETTINGS_TABLE_ID: "${VITE_NOCODB_RSS_SYNC_SETTINGS_TABLE_ID:-}"
        VITE_NOCODB_RSS_SYNC_SETTINGS_RECORD_ID: "${VITE_NOCODB_RSS_SYNC_SETTINGS_RECORD_ID:-}"
        VITE_NOCODB_PRODUCTION_POOL_TABLE_ID: "${VITE_NOCODB_PRODUCTION_POOL_TABLE_ID:-}"
        VITE_NOCODB_RADAR_POOL_TABLE_ID: "${VITE_NOCODB_RADAR_POOL_TABLE_ID:-}"
        VITE_NOCODB_ACCOUNT_METRICS_TABLE_ID: "${VITE_NOCODB_ACCOUNT_METRICS_TABLE_ID:-}"
        VITE_NOCODB_POST_METRICS_TABLE_ID: "${VITE_NOCODB_POST_METRICS_TABLE_ID:-}"
        VITE_NOCODB_ID_FIELD: "${VITE_NOCODB_ID_FIELD:-id}"
    ports:
      - "127.0.0.1:8088:80"
